name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tools/golden/dump.py records the last commit touching talaria/

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache: false # deliberate: correctness checks do not depend on a warm module cache

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System packages (ffmpeg with drawtext, just)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg just

      - name: Python dependencies
        run: python -m pip install -r requirements.txt

      - name: just check
        env:
          TALARIA_PYTHON: python
        run: just check

      - name: Differential oracle regression seeds (no fuzz campaign)
        env:
          TALARIA_PYTHON: python
        run: go test -tags pyoracle ./internal/text ./internal/posts
